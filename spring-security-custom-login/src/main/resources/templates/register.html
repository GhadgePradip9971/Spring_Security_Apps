<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body>

    <h2>Create Account</h2>

    <div th:if="${param.error}">
        <p style="color:red;">
            Registration failed
        </p>
    </div>

    <form th:action="@{/register}" method="post">

        <div>
            <label>Username:</label>
            <input type="text"
                   name="username"
                   required>
        </div>

        <br>

        <div>
            <label>Password:</label>
            <input type="password"
                   name="password"
                   required>
        </div>

        <br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a th:href="@{/login}">
        Already have an account? Login
    </a>

</body>

</html>
